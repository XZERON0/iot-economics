<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>IoT Экономика</title>
<style>
  :root { --bg:#eef2f4; --ink:#12262e; --mute:#5d727b; --card:#fff; --line:#d5dee2; --ok:#1f8a5b; --bad:#d9482b; --acc:#0d5c73; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; height:100vh; }
  nav { width:230px; background:var(--ink); color:#cfdde3; padding:22px 14px; display:flex; flex-direction:column; gap:6px; }
  nav h1 { font-size:18px; color:#fff; margin:0 8px 18px; line-height:1.3; }
  nav button { background:none; border:0; color:inherit; text-align:left; padding:12px; border-radius:8px; font-size:15px; cursor:pointer; }
  nav button:hover { background:#1d3a45; }
  nav button.on { background:var(--acc); color:#fff; }
  main { flex:1; padding:26px 30px; overflow:auto; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
  header h2 { font-size:26px; }
  header p { color:var(--mute); margin-top:4px; max-width:520px; }
  .kpi { background:var(--acc); color:#fff; padding:14px 20px; border-radius:12px; min-width:230px; }
  .kpi small { opacity:.8; display:block; }
  .kpi b { font-size:26px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card.alert { border-color:var(--bad); }
  .top { display:flex; justify-content:space-between; align-items:center; color:var(--mute); font-size:14px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--ok); }
  .alert .dot { background:var(--bad); }
  .val { font-size:32px; font-weight:600; margin:6px 0; }
  .val span { font-size:14px; color:var(--mute); font-weight:400; }
  canvas { width:100%; height:70px; display:block; }
  .foot { display:flex; gap:12px; align-items:center; margin-top:22px; }
  .foot button { background:var(--bad); color:#fff; border:0; padding:11px 18px; border-radius:8px; font-size:14px; cursor:pointer; }
  .foot span { color:var(--mute); font-size:14px; }
  #log { margin-top:14px; font-size:13px; color:var(--mute); }
  #log div { padding:3px 0; }
  #log .e { color:var(--bad); }
</style>
</head>
<body>
<nav id="nav"><h1>Интернет вещей<br>в экономике</h1></nav>
<main>
  <header>
    <div><h2 id="title"></h2><p id="desc"></p></div>
    <div class="kpi"><small id="kpiLabel"></small><b id="kpiVal"></b></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <button id="fail">Симулировать сбой</button>
    <span>Датчики выйдут за норму — смотри, как меняется экономический показатель.</span>
  </div>
  <div id="log"></div>
</main>

<script>
// ---------- Данные: 4 раздела, у каждого — «умные» датчики (симуляция) ----------
// base — норма, amp — шум, warn — порог тревоги (dir: 'hi' выше порога, 'lo' ниже)
const SECTIONS = [
  { id:'eco', name:'Экономика',
    desc:'Умные счётчики и датчики собирают данные о потреблении и ценах в реальном времени — это основа цифровой экономики.',
    sensors:[
      { n:'Потребление электроэнергии', u:'ГВт', base:120, amp:4, warn:135, dir:'hi' },
      { n:'Индекс потребительских цен', u:'пункты', base:100, amp:0.6, warn:104, dir:'hi' },
      { n:'Курс валюты', u:'₽/$', base:90, amp:0.8, warn:96, dir:'hi' }
    ],
    kpi:(v,a)=>({ l:'Индекс деловой активности', v:(100 + (v[0]-120)*0.4 - (v[1]-100)*2 - a*5).toFixed(1) }) },
  { id:'fin', name:'Финансы и банки',
    desc:'POS-терминалы и банкоматы — это IoT-устройства. Их поток данных показывает оборот и помогает ловить мошенничество.',
    sensors:[
      { n:'Транзакции POS', u:'в сек', base:850, amp:60, warn:1150, dir:'hi' },
      { n:'Загрузка банкоматов', u:'%', base:62, amp:4, warn:90, dir:'hi' },
      { n:'Подозрительные операции', u:'в мин', base:4, amp:1.5, warn:10, dir:'hi' }
    ],
    kpi:(v)=>({ l:'Оборот за минуту', v:(v[0]*60*1200/1e6).toFixed(1)+' млн ₽' }) },
  { id:'agro', name:'Сельское хозяйство',
    desc:'Датчики почвы и теплиц управляют поливом и климатом: меньше воды и потерь — выше урожай и прибыль.',
    sensors:[
      { n:'Влажность почвы', u:'%', base:45, amp:2, warn:30, dir:'lo' },
      { n:'Температура теплицы', u:'°C', base:24, amp:0.8, warn:32, dir:'hi' },
      { n:'Уровень воды в баке', u:'%', base:70, amp:1.5, warn:25, dir:'lo' }
    ],
    kpi:(v,a)=>({ l:'Прогноз урожайности', v:Math.max(35, 100 - a*22).toFixed(0)+' %' }) },
  { id:'ind', name:'Промышленность',
    desc:'Датчики на станках предсказывают поломки заранее. Предиктивное обслуживание экономит миллионы на простоях.',
    sensors:[
      { n:'Вибрация станка', u:'мм/с', base:3, amp:0.4, warn:6, dir:'hi' },
      { n:'Температура двигателя', u:'°C', base:70, amp:2, warn:90, dir:'hi' },
      { n:'Энергопотребление', u:'кВт', base:320, amp:15, warn:420, dir:'hi' }
    ],
    kpi:(v,a)=>({ l:'Риск потерь от простоя', v:(a*180).toLocaleString('ru-RU')+' тыс. ₽/ч' }) }
];

const N = 60; // точек в графике
SECTIONS.forEach(s => s.sensors.forEach(x => { x.v = x.base; x.hist = Array(N).fill(x.base); x.fault = 0; x.alert = false; }));

let cur = SECTIONS[0];
const $ = id => document.getElementById(id);

// ---------- Интерфейс ----------
SECTIONS.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s.name;
  b.onclick = () => select(s);
  s.btn = b;
  $('nav').appendChild(b);
});

function select(s) {
  cur = s;
  SECTIONS.forEach(x => x.btn.classList.toggle('on', x === s));
  $('title').textContent = s.name;
  $('desc').textContent = s.desc;
  $('grid').innerHTML = '';
  s.sensors.forEach(x => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="top"><span>${x.n}</span><i class="dot"></i></div>
      <div class="val"><b></b> <span>${x.u}</span></div><canvas></canvas>`;
    x.el = c; x.canvas = c.querySelector('canvas');
    $('grid').appendChild(c);
  });
  $('log').innerHTML = '';
  draw();
}

function draw() {
  cur.sensors.forEach(x => {
    x.el.classList.toggle('alert', x.alert);
    x.el.querySelector('b').textContent = x.v.toFixed(1);
    const cv = x.canvas, dpr = window.devicePixelRatio || 1;
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const w = cv.clientWidth, h = cv.clientHeight;
    const min = Math.min(...x.hist, x.warn), max = Math.max(...x.hist, x.warn);
    const y = val => h - 4 - (val - min) / (max - min || 1) * (h - 8);
    g.setLineDash([4,4]); g.strokeStyle = '#d9482b'; g.beginPath();
    g.moveTo(0, y(x.warn)); g.lineTo(w, y(x.warn)); g.stroke(); g.setLineDash([]);
    g.strokeStyle = x.alert ? '#d9482b' : '#0d5c73'; g.lineWidth = 2; g.beginPath();
    x.hist.forEach((val, i) => { const px = i / (N - 1) * w; i ? g.lineTo(px, y(val)) : g.moveTo(px, y(val)); });
    g.stroke();
  });
  const vals = cur.sensors.map(x => x.v), alerts = cur.sensors.filter(x => x.alert).length;
  const k = cur.kpi(vals, alerts);
  $('kpiLabel').textContent = k.l; $('kpiVal').textContent = k.v;
}

function log(text, bad) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString('ru-RU') + '  ' + text;
  if (bad) d.className = 'e';
  $('log').prepend(d);
}

// ---------- Симуляция датчиков: раз в секунду ----------
setInterval(() => {
  SECTIONS.forEach(s => s.sensors.forEach(x => {
    const target = x.fault > 0 ? x.warn + (x.dir === 'hi' ? 1 : -1) * x.amp * 3 : x.base;
    x.v += (target - x.v) * 0.25 + (Math.random() - 0.5) * x.amp;
    if (x.fault > 0) x.fault--;
    x.hist.push(x.v); x.hist.shift();
    const was = x.alert;
    x.alert = x.dir === 'hi' ? x.v > x.warn : x.v < x.warn;
    if (x.alert && !was && s === cur) log('ТРЕВОГА: ' + x.n + ' = ' + x.v.toFixed(1) + ' ' + x.u, true);
    if (!x.alert && was && s === cur) log('Норма: ' + x.n);
  }));
  draw();
}, 1000);

$('fail').onclick = () => {
  const x = cur.sensors[Math.floor(Math.random() * cur.sensors.length)];
  x.fault = 10;
  log('Сбой запущен: ' + x.n);
};

select(SECTIONS[0]);
</script>
</body>
</html>
